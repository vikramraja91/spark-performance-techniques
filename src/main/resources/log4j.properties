# Set everything to WARN except our application
log4j.rootCategory=WARN, console

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Set our application to INFO
log4j.logger.common=INFO
log4j.logger.01_memory_management=INFO
log4j.logger.02_shuffle_optimization=INFO

# Suppress overly verbose Spark logs
log4j.logger.org.apache.spark=WARN
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.sparkproject.jetty=WARN
log4j.logger.org.apache.spark.repl.Main=WARN
log4j.logger.org.apache.parquet=ERROR
log4j.logger.parquet=ERROR
log4j.logger.org.apache.hadoop.hive.metastore.RetryingHMSHandler=FATAL
log4j.logger.org.apache.hadoop.hive.ql.exec.FunctionRegistry=ERROR

# Show important Spark events
log4j.logger.org.apache.spark.SparkContext=INFO
log4j.logger.org.apache.spark.executor.Executor=INFO
log4j.logger.org.apache.spark.memory=INFO
